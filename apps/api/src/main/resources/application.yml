server:
  port: 8080

spring:
  application:
    name: devnagari-api

  datasource:
    url: jdbc:postgresql://localhost:5432/devnagari_pg
    username: devnagari
    password: devnagari_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
